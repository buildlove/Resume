<!DOCTYPE html>
<!--
  示例作品：CSS 充电动画（纯 HTML+CSS，无 JS）
  作用：演示"本地打包作品"如何接入作品集 —— 整个目录放到 works/<id>/ 即可
  更新：20261119 13:01:11
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>示例作品 · CSS 充电动画</title>
  <style>
    /* 页面基础 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 40px;
      background: radial-gradient(circle at 50% 30%, #1e293b, #0f172a);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e2e8f0;
    }

    /* ---------- 电池外壳 ---------- */
    .battery {
      position: relative;
      width: 140px; height: 240px;
      border: 6px solid #475569;
      border-radius: 22px;
      overflow: hidden;
    }

    /* 电池正极（顶部小凸起） */
    .battery::before {
      content: "";
      position: absolute; top: -18px; left: 50%;
      transform: translateX(-50%);
      width: 46px; height: 12px;
      background: #475569; border-radius: 6px 6px 0 0;
    }

    /* ---------- 充电液面：从下往上循环上涨 ---------- */
    .liquid {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 100%;
      background: linear-gradient(180deg, #38bdf8, #2563eb);
      /* 4 秒一循环：涨满 → 保持 → 重置 */
      animation: charge 4s ease-in-out infinite;
      transform-origin: bottom;
    }

    /* 液面顶部的波浪高光 */
    .liquid::before {
      content: "";
      position: absolute; top: -8px; left: -20%;
      width: 140%; height: 16px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 50%;
    }

    /* 充电动画关键帧：0% 空 → 75% 满 → 100% 保持后重置 */
    @keyframes charge {
      0%   { transform: scaleY(0.05); }
      75%  { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }

    /* ---------- 闪电图标（呼吸闪烁） ---------- */
    .bolt {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      animation: blink 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8));
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    /* 说明文字 */
    .tip { color: #94a3b8; font-size: 15px; letter-spacing: 1px; }
    .tip strong { color: #38bdf8; }
  </style>
</head>
<body>

  <!-- 电池 + 充电动画 -->
  <div class="battery">
    <div class="liquid"></div>
    <div class="bolt">⚡</div>
  </div>

  <p class="tip">示例作品 · 纯 CSS 实现 · <strong>作品集接入演示</strong></p>

</body>
</html>
